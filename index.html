<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekta date hobe? 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b3d;--bg2:#1d2f6b;--card:#182654;--gold:#ffd37a;--rose:#ff7a9a;--text:#fff7ea}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;user-select:none}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;text-align:center;padding:24px 16px 50px;touch-action:manipulation}
main{max-width:460px;margin:0 auto;min-height:82vh;display:flex;flex-direction:column;justify-content:center}
h1{font-family:Pacifico,cursive;font-weight:400;font-size:clamp(1.5rem,6.5vw,2.2rem);color:var(--gold);margin:10px 0;line-height:1.4}
p{line-height:1.6;margin:6px auto;font-size:1.05rem}
.msg-box{background:rgba(255,122,154,.12);border-left:3px solid var(--rose);padding:10px 14px;border-radius:10px;font-size:.95rem;color:#ffd9e2;margin:10px auto 14px;font-style:italic}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:#3b4e92;transition:.3s}
.dots i.on{background:var(--gold);transform:scale(1.2)}
.step{display:none;animation:in .4s}
.step.show{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #3b4e92;background:transparent;color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer;transition:.15s}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#3a0f26;font-weight:700;transform:scale(1.04)}

/* Quiz Question Cards */
.quiz-options{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.quiz-btn{background:#0f1b3d;border:2px solid #3b4e92;color:var(--text);padding:12px 16px;border-radius:12px;font:inherit;font-size:1rem;cursor:pointer;text-align:left;transition:.2s}
.quiz-btn:hover{border-color:var(--gold);background:#162452}

input,textarea,select{width:100%;font:inherit;color:var(--text);background:#0f1b3d;border:2px solid #3b4e92;border-radius:12px;padding:11px;margin-top:10px}
input[type=date]{color-scheme:dark}
.chip:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.b{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 24px;font-size:1.05rem;cursor:pointer}
.main{background:var(--gold);color:#2b1b00;box-shadow:0 4px 15px rgba(255,211,122,.3)}
.main:disabled{opacity:.6}
.ghost{background:transparent;color:var(--text);border:2px solid #3b4e92!important}
.nav{display:flex;gap:10px;justify-content:center;margin-top:8px}
.nav .main{flex:1}
.err{color:var(--rose);min-height:1.5em;margin:8px 0;font-weight:600}
#yes{font-size:1.25rem;padding:16px 38px;margin-top:20px;transition:transform .2s}
#no{background:transparent;color:var(--text);border:2px solid var(--rose)!important;position:fixed;left:62%;top:74%;transform:translate(-50%,-50%);transition:left .22s,top .22s;z-index:5}
.big{font-size:4.2rem;margin:8px 0}
canvas#c{position:fixed;inset:0;pointer-events:none;z-index:9}

/* Mini Game Styles */
#gameArea{position:relative;width:100%;height:290px;background:linear-gradient(180deg,#0b142e,#162452);border:2px solid var(--gold);border-radius:18px;overflow:hidden;margin:12px 0;cursor:pointer}
.falling-item{position:absolute;font-size:2.2rem;cursor:pointer;user-select:none;animation:pop .2s ease-out;padding:6px}
@keyframes pop{from{transform:scale(0.5)}to{transform:scale(1)}}
.score-pill{display:inline-block;background:var(--rose);color:#3a0f26;font-weight:700;padding:4px 14px;border-radius:99px;font-size:1rem;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <!-- 0: Jabe to? -->
  <section class="step" data-s="0">
    <div class="big">💌</div>
    <h1 id="ask"></h1>
    <p id="sub"></p>
    <div class="msg-box" id="introMsg"></div>
    <button class="b main" id="yes">Ha, jabo! 🥰</button>
  </section>
  <button class="b" id="no" style="display:none">Na</button>

  <!-- 1: Quiz Q1 -->
  <section class="step" data-s="1">
    <h1>Question 1 ✨</h1>
    <p>Tmi dekhte kmn?</p>
    <div class="quiz-options">
      <button class="quiz-btn" onclick="nextQuiz(2)">A) Porir moto 🧚‍♀️</button>
      <button class="quiz-btn" onclick="nextQuiz(2)">B) Putul er moto 🎎</button>
      <button class="quiz-btn" onclick="nextQuiz(2)">C) Reon er boww er moto 💍</button>
      <button class="quiz-btn" onclick="nextQuiz(2)" style="border-color:var(--gold)">D) Sob gulo! 😍</button>
    </div>
  </section>

  <!-- 2: Quiz Q2 -->
  <section class="step" data-s="2">
    <h1>Question 2 💖</h1>
    <p>Tmi amk koto ta vlobaso?</p>
    <div class="quiz-options">
      <button class="quiz-btn" onclick="nextQuiz(3)">A) Infinity ♾️</button>
      <button class="quiz-btn" onclick="nextQuiz(3)">B) More than Infinity 🚀</button>
      <button class="quiz-btn" onclick="nextQuiz(3)">C) Universe er soman 🌌</button>
      <button class="quiz-btn" onclick="nextQuiz(3)" style="border-color:var(--gold)">D) Universe er soman er ceyeo besi! 🥹❤️</button>
    </div>
  </section>

  <!-- 3: Heart Catching Mini Game -->
  <section class="step" data-s="3">
    <h1>Chotto Game! 🎮</h1>
    <p id="gameSub"></p>
    <div class="score-pill">Score: <span id="score">0</span> / <span id="target">7</span> 💖</div>
    <div id="gameArea"></div>
    <p style="font-size:.9rem;opacity:.85">Uronto heart (💖) gulote tap kore dhoro! 💣 dhorbe na kintu!</p>
  </section>

  <!-- 4: Kobe -->
  <section class="step" data-s="4">
    <h1>Kobe jabe? 📅</h1>
    <div class="msg-box" id="msgDate"></div>
    <div class="card">
      <input type="date" id="date" aria-label="Tarikh">
      <select id="time" aria-label="Somoy">
        <option>Sokal</option><option>Dupur</option><option selected>Bikel</option><option>Shondha</option><option>Raat</option>
      </select>
    </div>
  </section>

  <!-- 5: Kothay -->
  <section class="step" data-s="5">
    <h1>Kothay jabe? 📍</h1>
    <div class="msg-box" id="msgPlace"></div>
    <div class="card">
      <div class="chips" data-key="place" data-multi="0"></div>
      <input id="placeOther" placeholder="Onno kothao? Ekhane lekho">
    </div>
  </section>

  <!-- 6: Ki khabe -->
  <section class="step" data-s="6">
    <h1>Ki khabe? 🥟</h1>
    <div class="msg-box" id="msgFood"></div>
    <p style="font-size:.9rem;opacity:.85">Ekadhik bachte paro</p>
    <div class="card">
      <div class="chips" data-key="food" data-multi="1"></div>
      <input id="foodOther" placeholder="Onno kichu? Ekhane lekho">
    </div>
  </section>

  <!-- 7: Ar kichu -->
  <section class="step" data-s="7">
    <h1>Ar kichu bolbe? 💭</h1>
    <div class="msg-box" id="msgExtra"></div>
    <div class="card"><textarea id="extra" rows="4" placeholder="Amar jonno kono message ba wish thakle lekho…"></textarea></div>
  </section>

  <!-- 8: Sesh -->
  <section class="step" data-s="8">
    <div class="big">🎉</div>
    <h1 id="thanks"></h1>
    <p id="thanks2"></p>
    <div class="msg-box" id="finalMsg"></div>
  </section>

  <div class="err" id="err" role="alert"></div>
  <div class="nav" id="nav">
    <button class="b ghost" id="back">Ager ta</button>
    <button class="b main" id="next">Porer ta</button>
  </div>
</main>
<canvas id="c"></canvas>

<script>
/* ====== ✏️ EKHANE NIJER MOTO LEKHO ====== */
const CONFIG = {
  ask: "Amar sathe ekta date e jabe? 💞",
  sub: "Ekdom sotti kore bolo! 🥺",
  introMsg: "“Tomar sathe date e jawar age chotto ekta fun quiz ar game par korte hobe!” ✨",
  gameSub: "Date unlock korte 7 ta love heart dhoro! 💕",
  msgDate: "“Je din ta tomar sobcheye free ar bhalo lagbe, sei din-i hok amader din.” 🌸",
  msgPlace: "“Jekhanei jai na keno, tumi pashe thaklei jayga ta sundor hoye jabe.” 🥰",
  msgFood: "“Fuchka theke Cha—tomar sob favourite khabar aaj amar treat!” 😋",
  msgExtra: "“Kono luko-churi chara moner kotha likhe felo…” 💌",
  finalMsg: "“Can't wait to see your smile! Taratari dekha hochhe.” ❤️",

  accessKey: "de58826d-c494-4b44-a773-cf82da78f46d",
  places: ["Cafe ☕","Restaurant 🍽️","Park 🌳","Nodir par 🌊","Tong er dokan 🛖","Cinema 🎬","Shopping 🛍️"],
  foods: ["Fuchka 🥟","Belpuri 🥗","Chotpoti 🍲","Cha ☕","Biryani 🍛","Pizza 🍕","Burger 🍔","Ice cream 🍦","Coffee ☕"],
  noTexts: ["Na","Ei to, dhoro!","Parbe na 😜","Hehe 😏","Aro kache ay 🏃","Haar maano 🙈","Thik ache, jabo 😳"],
  thanks: "Pathiye diyechi! 🎉",
  thanks2: "Ami dekhe nichchi. Ekhon ready hoye thako! 💕",
  targetScore: 7
};
/* ======================================= */

const $ = id => document.getElementById(id);
$("ask").textContent = CONFIG.ask;
$("sub").textContent = CONFIG.sub;
$("introMsg").textContent = CONFIG.introMsg;
$("gameSub").textContent = CONFIG.gameSub;
$("msgDate").textContent = CONFIG.msgDate;
$("msgPlace").textContent = CONFIG.msgPlace;
$("msgFood").textContent = CONFIG.msgFood;
$("msgExtra").textContent = CONFIG.msgExtra;
$("finalMsg").textContent = CONFIG.finalMsg;
$("thanks").textContent = CONFIG.thanks;
$("thanks2").textContent = CONFIG.thanks2;
$("target").textContent = CONFIG.targetScore;
$("date").min = new Date().toISOString().slice(0,10);

const steps = [...document.querySelectorAll(".step")];
const LAST_INPUT = 7; // 7 = "Ar kichu" step
let cur = 0;
steps.forEach((_,i)=>{ if(i<9){ const d=document.createElement("i"); $("dots").appendChild(d);} });

function show(n){
  cur = n;
  steps.forEach((s,i)=>s.classList.toggle("show", i===n));
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("on", i<=n));
  $("no").style.display = n===0 ? "block" : "none";
  // Step 0 (Start), Steps 1 & 2 (Quiz), Step 3 (Game), Step 8 (End) e nav button thakbe na
  $("nav").style.display = (n===0 || n===1 || n===2 || n===3 || n===8) ? "none" : "flex";
  $("back").style.visibility = n===4 ? "hidden" : "visible";
  $("next").textContent = n===LAST_INPUT ? "Pathao 💌" : "Porer ta";
  $("err").textContent = "";
  
  if(n === 3) {
    startGame();
  }
}
show(0);

function nextQuiz(targetStep) {
  burst(50);
  show(targetStep);
}

/* Mini Game Logic */
let gameTimer = null, score = 0;
function startGame(){
  score = 0;
  $("score").textContent = score;
  const area = $("gameArea");
  area.innerHTML = "";
  clearInterval(gameTimer);

  gameTimer = setInterval(()=>{
    if(cur !== 3){ clearInterval(gameTimer); return; }
    const item = document.createElement("div");
    item.className = "falling-item";
    const isBomb = Math.random() < 0.22; // 22% chance bomb ashar
    item.textContent = isBomb ? "💣" : (Math.random() < 0.5 ? "💖" : "💝");
    item.style.left = (10 + Math.random() * 80) + "%";
    item.style.top = "-40px";
    area.appendChild(item);

    let y = -40;
    const speed = 2.2 + Math.random() * 2.2;
    const fall = setInterval(()=>{
      if(cur !== 3){ clearInterval(fall); item.remove(); return; }
      y += speed;
      item.style.top = y + "px";
      if(y > 300){ clearInterval(fall); item.remove(); }
    }, 16);

    const hit = (e)=>{
      e.preventDefault();
      clearInterval(fall);
      item.remove();
      if(isBomb){
        score = Math.max(0, score - 1);
        $("err").textContent = "Oops! 💣 e tap lagse, 1 point komlo! 😅";
      } else {
        score++;
        $("err").textContent = "";
      }
      $("score").textContent = score;
      if(score >= CONFIG.targetScore){
        clearInterval(gameTimer);
        area.innerHTML = "<div style='padding-top:110px;font-size:1.4rem;color:var(--gold);font-weight:700'>🎉 Wah! Jite gecho! Ebar date plan kori...</div>";
        burst(140);
        setTimeout(()=> show(4), 1300);
      }
    };
    item.addEventListener("pointerdown", hit);
  }, 550);
}

/* chips */
const picked = {place:[], food:[]};
function chips(key, list){
  const box = document.querySelector('[data-key="'+key+'"]');
  const multi = box.dataset.multi === "1";
  list.forEach(t=>{
    const b = document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=t; b.setAttribute("aria-pressed","false");
    b.onclick = ()=>{
      const on = b.getAttribute("aria-pressed") !== "true";
      if(!multi){ box.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false")); picked[key]=[]; }
      b.setAttribute("aria-pressed", on);
      if(on) picked[key].push(t); else picked[key]=picked[key].filter(x=>x!==t);
    };
    box.appendChild(b);
  });
}
chips("place", CONFIG.places);
chips("food", CONFIG.foods);

/* "Na" button: dhora jabe na */
const no = $("no");
let tries = 0, last = 0;
function flee(e){
  if(cur!==0) return;
  if(e && e.cancelable) e.preventDefault();
  const now = Date.now(); if(now-last<180) return; last = now; tries++;
  no.textContent = CONFIG.noTexts[Math.min(tries, CONFIG.noTexts.length-1)];
  if(tries>=10){
    no.textContent = "Ha, jabo! 🥰";
    no.style.left="50%"; no.style.top="85%";
    no.onclick = yes; no.style.borderColor="var(--gold)"; no.style.color="var(--gold)";
    return;
  }
  const w=no.offsetWidth,h=no.offsetHeight,m=14;
  no.style.left=(m+w/2+Math.random()*(innerWidth-w-2*m))+"px";
  no.style.top =(m+h/2+Math.random()*(innerHeight-h-2*m))+"px";
  $("yes").style.transform="scale("+Math.min(1.35,1+tries*0.035)+")";
}
document.addEventListener("pointermove", e=>{
  if(cur!==0 || tries>=10) return;
  const r=no.getBoundingClientRect();
  if(Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2))<90) flee(e);
});
["pointerdown","touchstart","click"].forEach(ev=>no.addEventListener(ev,e=>{ if(tries<10) flee(e); },{passive:false}));

/* confetti */
const cv=$("c"), ctx=cv.getContext("2d"); let bits=[], raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener("resize",size); size();
function burst(n){
  const cols=["#ff7a9a","#ffd37a","#fff7ea","#9fb4ff"];
  for(let i=0;i<n;i++) bits.push({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*14,vy:Math.random()*-13-2,s:Math.random()*6+9,r:Math.random()*6,c:cols[i%4]});
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.vy+=.25;b.x+=b.vx;b.y+=b.vy;b.r+=.1;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.font=b.s*2+"px serif";ctx.fillText("♥",0,0);ctx.restore();});
  bits=bits.filter(b=>b.y<cv.height+40);
  raf=bits.length?requestAnimationFrame(loop):null;
}

function yes(){
  burst(100);
  show(1); // Quiz Q1 এ যাবে
}
$("yes").onclick = yes;
$("back").onclick = ()=> show(cur-1);

$("next").onclick = async ()=>{
  const place = picked.place.concat($("placeOther").value.trim()||[]).join(", ");
  const food  = picked.food.concat($("foodOther").value.trim()||[]).join(", ");
  if(cur===4 && !$("date").value){ $("err").textContent="Age tarikh ta bachho 📅"; return; }
  if(cur===5 && !place){ $("err").textContent="Kothay jabe seta bachho 📍"; return; }
  if(cur<LAST_INPUT){ show(cur+1); return; }

  const message =
    "📅 Kobe: "+$("date").value+" ("+$("time").value+")\n"+
    "📍 Kothay: "+place+"\n"+
    "🥟 Ki khabe: "+(food||"kichu bole ni")+"\n"+
    "💭 Ar kichu: "+($("extra").value.trim()||"—");
  $("next").disabled=true; $("next").textContent="Pathachchi…";
  try{
    const r = await fetch("https://api.web3forms.com/submit",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({access_key:CONFIG.accessKey,subject:"💌 Date er answer ashche!",from_name:"Date Invite",message})
    });
    const j = await r.json();
    if(!j.success) throw new Error(j.message||"failed");
    burst(160); show(8);
  }catch(e){
    $("err").textContent="Pathano gelo na 😕 Karon: "+(e&&e.message?e.message:"internet/network");
    $("next").disabled=false; $("next").textContent="Pathao 💌";
  }
};
</script>
</body>
</html>
